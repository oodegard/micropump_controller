# Microscope Button Click Test
# Press the Run1_start.png button on the microscope software
# The button name in YAML matches the PNG filename in buttons/ folder

required hardware:
  pump: false
  valve: false
  microscope: true


run:
  # Template matching version (EmguCV now installed!)
  # Place button screenshots in the buttons/ folder next to the C# server
  # The server will find and click the button automatically
  - microscope: Run1_start
  - wait: 2
  
  # Alternative: coordinate-based clicking (if template matching fails)
  # - microscope:
  #     action: click
  #     x: 20
  #     y: 1060
  
  # Other examples:
  # - microscope: Stop_button        # Click Stop button using template matching
  # - microscope: Acquire_image      # Click Acquire button
  # - microscope: {action: click, x: 450, y: 120}  # Direct coordinates


pump settings:
  normal speed:
    waveform: RECT      # Shape of the pump signal (e.g., RECT = rectangular)
    voltage: 80        # Voltage to apply to the pump (in Volts)
    freq: 80            # Frequency of the pump signal (in Hz)

required hardware:
  pump: true             # Set to true if a pump is connected
  valve: true            # Set to true if a valve is connected
  pipetting robot: true # TODO: add support for pipetting robot control
  microscope: true       # Audio-based microscope trigger via 1000 Hz signal
run:
  
  # Start time-lapse acquisition
  - microscope: Fusion_Acquire # Take image
    wait_complete: false  # Don't wait for acquisition to finish

  - pump_on: normal speed  # Turn on the pump using the 'normal speed' settings above      
  - loop:
      repeat: 10          # Number of times to repeat the sequence
      steps:
        - valve_on: 5   # Open valve for 10 seconds
        - pump_off: 0

        - microscope: Fusion_Acquire # Take image
          confidence: 0.95
        - valve_off: 5  # Close valve for 10 seconds

        - pump_on: normal speed  # Turn on the pump using the 'normal speed' settings above
        - valve_off: 5  # Close valve for 10 seconds
        - pump_off: 0
                
        - microscope: Fusion_Acquire
          confidence: 0.95  


  - pump_off: 0          # Turn off the pump (the value '0' is ignored)

# Summary:
# This example runs the pump for 2 minutes, switching the valve on and off every 5 seconds.
# Then it repeats the process with a slower pump profile.
#
# To customize:
# - Change the 'voltage' or 'freq' values in 'pump settings' to change the liquid flow rate.
# - Change the 'wait' values for pump or valve steps.
# - Add more steps to the 'run' sequence as needed.

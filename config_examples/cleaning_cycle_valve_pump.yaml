######################################################################
# Pump on for 10 seconds example
#
# This minimal configuration powers the pump using a single profile,
# keeps it running for 10 seconds, then turns it off.
#
# Run (real hardware):
#   python run_protocol_cli.py config_examples/pump_on_10s.yaml
# Run (dry-run simulation):
#   python run_protocol_cli.py --dry-run config_examples/pump_on_10s.yaml
######################################################################

pump settings:
  full flow:
    waveform: RECT
    voltage: 100   # Vpp
    freq: 100       # Hz

required hardware:
  pump: true
  valve: true
  pipetting robot: false
  microscope: false

run:
  - pinch_valve_on: 0


  # wash tube B
  - valve_toggle: 0 # turn on valve to tube B
  - pump_on: full flow
  - wait: 30    # Keep pump running for x seconds
  - valve_toggle: 0 # turn off valve - back to tube A

  # wash tube A 

  - wait: 30    # Keep pump running for x seconds


  # stop pump
  - pump_off: 0     # Value ignored; serves as an action trigger
  - pinch_valve_off: 0

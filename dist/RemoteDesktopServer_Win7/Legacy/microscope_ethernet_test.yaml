# Example: Microscope control via ethernet cable

# Microscope communication mode: 'ethernet'
# Requires direct ethernet cable between PCs (no network setup needed)
microscope_mode: ethernet

pump settings:
  default:
    waveform: RECT
    voltage: 100
    freq: 50

required hardware:
  pump: false
  valve: false
  microscope: true

run:
  # Send RUN command to microscope PC via ethernet
  - microscope: run
  
  # Wait for microscope to process
  - wait: 2
  
  # Send another RUN command
  - microscope: run
